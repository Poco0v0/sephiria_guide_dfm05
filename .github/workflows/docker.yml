name: Build and publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for startup check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sephiria-guide:check
          cache-from: type=gha,scope=sephiria-guide
          cache-to: type=gha,mode=max,scope=sephiria-guide

      - name: Check container startup and app entrypoint
        shell: bash
        run: |
          docker run --detach --name sephiria-check \
            --publish 127.0.0.1:8501:8501 sephiria-guide:check
          trap 'docker logs sephiria-check; docker rm --force sephiria-check' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              docker exec sephiria-check python -c \
                'from streamlit.testing.v1 import AppTest; app = AppTest.from_file("/app/sephiriadfm05.py").run(timeout=30); assert not app.exception, [error.message for error in app.exception]'
              exit 0
            fi
            sleep 2
          done

          echo "Streamlit did not become healthy within 60 seconds." >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sephiria-guide
          cache-to: type=gha,mode=max,scope=sephiria-guide
